<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaiyaphum Tour AI Chatbot</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Sarabun", sans-serif;
            background-color: #f5f5f5;
        }

        .header {
            height: 60px;
            background: #0d6efd;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
        }

        .chat-container {
            width: 100%;
            height: calc(100vh - 60px);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        @media (max-width: 768px) {
            .header {
                font-size: 18px;
                height: 50px;
            }

            .chat-container {
                height: calc(100vh - 50px);
            }
        }
    </style>
</head>

<body>

    <div class="header">
        🤖 Chaiyaphum Tour AI Chatbot
    </div>

    <div class="chat-container">
        <iframe
            src="https://phumtour.cpru.ac.th/chatbot/TgEOjm6RbKFcLwrW"
            allow="microphone">
        </iframe>
    </div>

</body>
</html>
